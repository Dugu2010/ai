# Render Blueprint for the DAI backend
# Deploy: Render Dashboard → New → Blueprint → select this repo
services:
  - type: web
    name: dai-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: dai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DAI_API_KEY_ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ai-web-git-master-wither2.vercel.app,https://ai-web-wither2.vercel.app
      # Add these manually in the Render dashboard (secret):
      # FREESTYLE_API_KEY  — VM provisioning
      # NIM_API_KEY        — NVIDIA NIM LLM access

databases:
  - name: dai-db
    plan: free
    databaseName: dai
    user: dai
