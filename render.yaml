# Render Blueprint for the DAI backend
# Deploy: Render Dashboard → New → Blueprint → select this repo
#
# ⚠️ IMPORTANT — if your existing Render service runs the FRONTEND (symptom:
# `Running 'cd apps/web && npx next start'` in the deploy log and the API URL
# serving the web app), that service was created from the repo root without a
# Root Directory. Blueprints only apply on first creation, so fix it in the
# dashboard:
#   Settings → Root Directory: apps/api
#   Build Command:            npm install && npm run build
#   Start Command:            npm start
#   Health Check Path:        /health
# then create a SECOND service (type: web) for apps/web only if you truly want
# the frontend on Render too — Vercel already serves it.
services:
  - type: web
    name: dai-api
    runtime: node
    rootDir: apps/api
    plan: free
    # dist/ is gitignored, so the workspace packages (@dai/db, @dai/modal,
    # ...) must be built on the server before the API can require them.
    # Repo scripts use bun, so bootstrap bun first.
    buildCommand: cd ../.. && npm install -g bun && bun install && bun run build:packages && bun run build:api
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: dai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DAI_API_KEY_ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ai-web-git-master-wither2.vercel.app,https://ai-web-wither2.vercel.app
      # Wildcard for Vercel preview deployments (ai-<hash>-wither2.vercel.app).
      # Empty = disabled; change to your team's vercel.app suffix if it differs.
      - key: VERCEL_DOMAIN_SUFFIX
        value: wither2.vercel.app
      # Add these manually in the Render dashboard as secret env vars:
      #   MODAL_TOKEN_ID / MODAL_TOKEN_SECRET — execution runtime (Modal)
      #   NIM_API_KEY                         — NVIDIA NIM LLM access
      # Optional non-secret overrides for the Vercel path: VERCEL_CACHE_DRIVE,
      # VERCEL_CACHE_PATH, VERCEL_SANDBOX_MAX_VCPUS, PUBLIC_API_URL (the API's own
      # origin, needed for absolute proxied preview URLs).
      #
      # Optional non-secret overrides: MODAL_CPU, MODAL_MEMORY_MIB,
      # MODAL_IDLE_TIMEOUT_MS, MODAL_VOLUME_NAME, MODAL_PREVIEW_PORTS.
      #
      # To move execution onto Vercel Sandbox + Drives with an R2 mirror, add
      # VERCEL_TOKEN and the R2_* values as secrets and set RUNTIME_PROVIDER to
      # vercel -- but only after `bun run tsx scripts/migrate-runtime-v2.ts`
      # has copied every workspace out of the Modal Volume. See
      # VERCEL_RUNTIME_MIGRATION.md for the order of operations.
      #
      # The Modal image is built once out-of-band (never during a request):
      #   bun run tsx scripts/build-runtime-image.ts

databases:
  - name: dai-db
    plan: free
    databaseName: dai
    user: dai
