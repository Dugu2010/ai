# Render Blueprint for the DAI backend
# Deploy: Render Dashboard → New → Blueprint → select this repo
#
# ⚠️ IMPORTANT — if your existing Render service runs the FRONTEND (symptom:
# `Running 'cd apps/web && npx next start'` in the deploy log and the API URL
# serving the web app), that service was created from the repo root without a
# Root Directory. Blueprints only apply on first creation, so fix it in the
# dashboard:
#   Settings → Root Directory: apps/api
#   Build Command:            npm install && npm run build
#   Start Command:            npm start
#   Health Check Path:        /health
# then create a SECOND service (type: web) for apps/web only if you truly want
# the frontend on Render too — Vercel already serves it.
services:
  - type: web
    name: dai-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: dai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DAI_API_KEY_ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ai-web-git-master-wither2.vercel.app,https://ai-web-wither2.vercel.app
      # Add these manually in the Render dashboard (secret):
      # FREESTYLE_API_KEY  — VM provisioning
      # NIM_API_KEY        — NVIDIA NIM LLM access

databases:
  - name: dai-db
    plan: free
    databaseName: dai
    user: dai
