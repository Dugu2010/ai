services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dai
      POSTGRES_PASSWORD: dai
      POSTGRES_DB: dai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dai -d dai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
